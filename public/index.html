<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FPL League Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #5fe0ff;
    --live: #ff6a6a;
    --gold: #ffd54a;
    --glass-bg: rgba(255,255,255,0.06);
    --glass-bg-soft: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.14);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.5);
    --muted-strong: rgba(255,255,255,0.65);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1b2e 0%, #122a24 100%);
    background-attachment: fixed;
    color: var(--text);
    margin: 0;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: min(480px, 94vw); margin: 0 auto; }
  .numeric { font-family: 'Rajdhani', sans-serif; font-variant-numeric: tabular-nums; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
  }

  .header { padding: 14px 16px; margin-bottom: 12px; }
  .eyebrow { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .eyebrow span.label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; color: #fff; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .banner {
    padding: 10px 14px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
  }
  .banner b { color: #fff; }
  .banner .val { font-size: 15px; font-weight: 800; color: var(--accent); font-family: 'Rajdhani', sans-serif; }
  .banner.pending { border: none; }
  .banner .pending-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  .banner .confirmed-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .banner .pending-text { display: flex; flex-direction: column; gap: 2px; }
  .banner .pending-title { font-size: 12.5px; font-weight: 600; color: var(--gold); }
  .banner .confirmed-title { font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .banner .pending-sub { font-size: 11px; color: var(--muted); }
  .banner.celebrate { background: rgba(255,213,74,0.1); }
  .banner .celebrate-icon { font-size: 18px; flex-shrink: 0; }
  .banner .celebrate-title { font-size: 12.5px; font-weight: 700; color: var(--gold); }

  .tabs { padding: 4px; display: flex; gap: 3px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1;
    padding: 9px 6px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: rgba(255,255,255,0.14); color: #fff; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card-table { overflow: hidden; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .row:last-child { border-bottom: none; }
  .row.rank-1 { background: rgba(255,213,74,0.08); }

  .row-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .rank { width: 24px; text-align: center; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .rank-medal { font-size: 16px; }
  .team-text { min-width: 0; }
  .team { font-weight: 600; font-size: 13.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .manager { color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .row-right { display: flex; gap: 6px; flex-shrink: 0; }
  .score-chip {
    display: inline-block;
    width: 38px;
    text-align: center;
    padding: 3px 0;
    border-radius: 7px;
    background: rgba(255,255,255,0.09);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
  }
  .score-chip.accent { background: rgba(95,224,255,0.14); color: var(--accent); }

  .live-badge, .win-badge, .draw-badge {
    display: inline-block;
    margin-left: 5px;
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 5px;
    vertical-align: middle;
  }
  .live-badge { color: var(--live); background: rgba(255,106,106,0.15); animation: pulse 1.4s ease-in-out infinite; }
  .win-badge { color: #7dffb3; background: rgba(125,255,179,0.15); }
  .draw-badge { color: var(--accent); background: rgba(95,224,255,0.15); }

  .status { color: var(--muted); font-size: 12.5px; padding: 22px 0; text-align: center; }
  .updated { color: var(--muted); font-size: 10.5px; margin-top: 8px; text-align: right; padding: 0 2px; }
  .footnote { color: var(--muted); font-size: 11.5px; margin-top: 22px; line-height: 1.6; padding: 12px 14px; }

  .squad-row-wrap { padding: 10px 12px 12px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .squad-section-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 6px 0 5px; }
  .squad-section-title:first-child { margin-top: 0; }
  .squad-players { display: flex; flex-wrap: wrap; gap: 5px; }
  .player-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    color: #fff;
  }
  .player-chip .cap { color: var(--accent); font-weight: 800; margin-left: 3px; }
  .player-chip .pts { color: var(--muted); font-family: 'Rajdhani', sans-serif; font-weight: 700; margin-left: 3px; }
  .player-chip .pos {
    display: inline-block;
    font-size: 8.5px;
    font-weight: 700;
    color: #0d1117;
    border-radius: 3px;
    padding: 1px 4px;
    margin-right: 3px;
  }
  .player-chip .pos.GK { background: var(--gold); }
  .player-chip .pos.DEF { background: #7dc4ff; }
  .player-chip .pos.MID { background: #7dffb3; }
  .player-chip .pos.FWD { background: var(--live); }
  .chip-used { color: var(--accent); font-weight: 600; margin-bottom: 6px; font-size: 11.5px; }
  .row[data-entry] { cursor: pointer; }

  .feed-card { padding: 12px 13px; margin-bottom: 8px; border-left: 3px solid var(--muted); border-radius: 0 16px 16px 0; }
  .feed-card.steal { border-left-color: var(--live); }
  .feed-card.tie { border-left-color: var(--accent); }
  .feed-card.normal { border-left-color: #7dffb3; }
  .feed-gw { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .feed-msg { font-size: 13px; line-height: 1.55; color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header glass">
      <div class="eyebrow"><span class="dot"></span><span class="label">Live scoreboard</span></div>
      <h1 id="league-name">FPL League Scoreboard</h1>
      <div class="sub" id="sub-text">กำลังโหลด...</div>
    </div>

    <div id="leader-banner" class="banner glass" style="display:none"></div>

    <div class="tabs glass">
      <button class="tab-btn active" data-tab="standings">อันดับ FPL</button>
      <button class="tab-btn" data-tab="bonus">รายได้สะสม</button>
      <button class="tab-btn" data-tab="feed">ไฮไลท์</button>
    </div>

    <div id="panel-standings" class="tab-panel active">
      <div id="standings-status" class="status">กำลังโหลด...</div>
      <div id="standings-table" class="card-table glass" style="display:none"></div>
      <div id="standings-updated" class="updated"></div>
    </div>

    <div id="panel-bonus" class="tab-panel">
      <div id="bonus-status" class="status">กำลังโหลด...</div>
      <div id="bonus-table" class="card-table glass" style="display:none"></div>
      <div id="bonus-updated" class="updated"></div>
    </div>

    <div id="panel-feed" class="tab-panel">
      <div id="feed-status" class="status">กำลังโหลด...</div>
      <div id="feed-list"></div>
    </div>

    <div class="footnote"></div>
  </div>

  <script>
    const LEAGUE_ID = '477187';
    const MEDALS = ['🥇', '🥈', '🥉'];
    let currentGwForSquad = null;
    let standingsState = null;
    let bonusState = null;

    const CELEBRATE_WIN_MESSAGES = [
      '🎉 {names} คว้าแต้มพิเศษไปครองเต็มๆ เก่งมาก!',
      '🏆 ขอปรบมือให้ {names} แชมป์ประจำสัปดาห์นี้!',
      '🔥 {names} ทำได้! เก็บแต้มพิเศษไปแบบไม่มีคู่แข่ง',
    ];
    const CELEBRATE_DRAW_MESSAGES = [
      '🤝 {names} เสมอกันไปคนละครึ่ง ยินดีด้วยทั้งคู่!',
      '👏 {names} ฟอร์มดีพอกัน แบ่งแต้มพิเศษกันไปแบบสันติภาพ',
    ];

    function pick(list, seed) {
      return list[((seed % list.length) + list.length) % list.length];
    }

    function renderBanner() {
      const bannerEl = document.getElementById('leader-banner');
      if (!standingsState) return;

      bannerEl.className = 'banner glass';

      if (standingsState.currentGameweekLocked) {
        if (bonusState && bonusState.recentWinnerNames && bonusState.recentWinnerNames.length > 0) {
          const names = bonusState.recentWinnerNames.join(' และ ');
          const template = bonusState.recentWasDraw
            ? pick(CELEBRATE_DRAW_MESSAGES, bonusState.latestLockedGameweek)
            : pick(CELEBRATE_WIN_MESSAGES, bonusState.latestLockedGameweek);
          const message = template.replace('{names}', names);
          bannerEl.classList.add('celebrate');
          bannerEl.innerHTML = `
            <span class="celebrate-icon">🏆</span>
            <div class="pending-text">
              <span class="celebrate-title">GW${bonusState.latestLockedGameweek} จบแล้ว!</span>
              <span class="pending-sub">${message}</span>
            </div>
          `;
          bannerEl.style.display = 'flex';
        } else {
          bannerEl.style.display = 'none';
        }
        return;
      }

      if (standingsState.gwFinished && !standingsState.gwDataChecked) {
        const leaderNote =
          standingsState.currentLeaders && standingsState.currentLeaders.length > 0
            ? `ตอนนี้ ${standingsState.currentLeaders.map((l) => l.teamName).join(', ')} นำอยู่ ${standingsState.currentLeaders[0].gwPoints} แต้ม`
            : 'กำลังรวบรวมผลคะแนน';
        bannerEl.innerHTML = `
          <span class="pending-dot"></span>
          <div class="pending-text">
            <span class="pending-title">FPL ยังไม่ล็อกผลการแข่งขัน</span>
            <span class="pending-sub">${leaderNote} · รอยืนยันแต้มโบนัส</span>
          </div>
        `;
        bannerEl.style.display = 'flex';
      } else if (standingsState.gwFinished && standingsState.gwDataChecked) {
        const leaderNote =
          standingsState.currentLeaders && standingsState.currentLeaders.length > 0
            ? `ผู้นำตอนนี้: ${standingsState.currentLeaders.map((l) => l.teamName).join(', ')} — ${standingsState.currentLeaders[0].gwPoints} แต้ม`
            : 'กำลังสรุปผล';
        bannerEl.innerHTML = `
          <span class="confirmed-dot"></span>
          <div class="pending-text">
            <span class="confirmed-title">FPL ยืนยันผลแล้ว รอระบบล็อกอัตโนมัติ</span>
            <span class="pending-sub">${leaderNote} · ล็อกภายใน 15 นาที</span>
          </div>
        `;
        bannerEl.style.display = 'flex';
      } else if (standingsState.currentLeaders && standingsState.currentLeaders.length > 0) {
        const names = standingsState.currentLeaders.map((l) => l.teamName).join(', ');
        bannerEl.innerHTML = `
          <span>กำลังนำอยู่: <b>${names}</b></span>
          <span class="val">${standingsState.currentLeaders[0].gwPoints}</span>
        `;
        bannerEl.style.display = 'flex';
      } else {
        bannerEl.style.display = 'none';
      }
    }

    function rankCell(i) {
      if (i < 3) return `<span class="rank-medal">${MEDALS[i]}</span>`;
      return `${i + 1}`;
    }

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    function renderPlayerChips(list) {
      return list
        .map(
          (p) => `<span class="player-chip"><span class="pos ${p.position}">${p.position}</span> ${p.name}${
            p.isCaptain ? '<span class="cap">C</span>' : p.isViceCaptain ? '<span class="cap">VC</span>' : ''
          } <span class="pts">${p.total}</span></span>`
        )
        .join('');
    }

    async function toggleSquad(row, entryId) {
      const existing = row.nextElementSibling;
      if (existing && existing.classList.contains('squad-row')) {
        existing.remove();
        return;
      }
      document.querySelectorAll('.squad-row').forEach((el) => el.remove());
      if (!currentGwForSquad) return;

      const detailRow = document.createElement('div');
      detailRow.className = 'squad-row squad-row-wrap';
      detailRow.textContent = 'กำลังโหลดทีม...';
      row.after(detailRow);

      try {
        const res = await fetch(`/api/squad?entry=${entryId}&event=${currentGwForSquad}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'โหลดไม่สำเร็จ');

        detailRow.innerHTML = `
          ${data.activeChip ? `<div class="chip-used">ใช้ชิป: ${data.activeChip}</div>` : ''}
          <div class="squad-section-title">ตัวจริง</div>
          <div class="squad-players">${renderPlayerChips(data.starting)}</div>
          <div class="squad-section-title">ตัวสำรอง</div>
          <div class="squad-players">${renderPlayerChips(data.bench)}</div>
        `;
      } catch (err) {
        detailRow.textContent = 'โหลดทีมไม่สำเร็จ: ' + err.message;
      }
    }

    let deadlineTarget = null;
    let deadlineGw = null;

    function renderCountdown() {
      const subEl = document.getElementById('sub-text');
      if (!deadlineTarget) return;
      const diff = deadlineTarget - Date.now();
      if (diff <= 0) {
        subEl.textContent = `ปิดรับเปลี่ยนตัว GW${deadlineGw} แล้ว`;
        return;
      }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      let parts = [];
      if (days > 0) parts.push(`${days} วัน`);
      parts.push(`${hours} ชม.`);
      parts.push(`${mins} นาที`);
      subEl.textContent = `ปิดรับเปลี่ยนตัว GW${deadlineGw} ในอีก ${parts.join(' ')}`;
    }

    async function loadDeadline() {
      const subEl = document.getElementById('sub-text');
      try {
        const res = await fetch('/api/deadline');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();
        if (!data.deadline) {
          subEl.textContent = data.message || 'ไม่มี deadline ถัดไป';
          return;
        }
        deadlineTarget = new Date(data.deadline).getTime();
        deadlineGw = data.gameweek;
        renderCountdown();
      } catch (err) {
        subEl.textContent = '-';
      }
    }

    async function loadStandings() {
      const statusEl = document.getElementById('standings-status');
      const tableEl = document.getElementById('standings-table');

      try {
        const res = await fetch(`/api/standings?league=${LEAGUE_ID}`);
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.leagueName) document.getElementById('league-name').textContent = data.leagueName;
        if (data.currentGameweek) currentGwForSquad = data.currentGameweek;

        const sortedResults = [...data.results].sort((a, b) => b.gwPoints - a.gwPoints);

        tableEl.innerHTML = sortedResults
          .map(
            (r, i) => `
          <div class="row ${i === 0 ? 'rank-1' : ''}" data-entry="${r.entryId}">
            <div class="row-left">
              <span class="rank">${rankCell(i)}</span>
              <div class="team-text">
                <div class="team">${r.teamName}</div>
                <div class="manager">${r.managerName}</div>
              </div>
            </div>
            <div class="row-right">
              <span class="score-chip accent">${r.gwPoints}</span>
              <span class="score-chip">${r.totalPoints}</span>
            </div>
          </div>`
          )
          .join('');

        tableEl.querySelectorAll('.row[data-entry]').forEach((row) => {
          row.addEventListener('click', () => toggleSquad(row, row.dataset.entry));
        });

        standingsState = {
          currentGameweekLocked: data.currentGameweekLocked,
          gwFinished: data.gwFinished,
          gwDataChecked: data.gwDataChecked,
          currentLeaders: data.currentLeaders,
        };
        renderBanner();

        statusEl.style.display = 'none';
        tableEl.style.display = 'block';
        document.getElementById('standings-updated').textContent =
          'อัปเดตล่าสุด: ' + new Date(data.updatedAt).toLocaleString('th-TH');
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    async function loadBonus() {
      const statusEl = document.getElementById('bonus-status');
      const tableEl = document.getElementById('bonus-table');

      try {
        const res = await fetch('/api/bonus');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        bonusState = {
          latestLockedGameweek: data.latestLockedGameweek,
          recentWinnerNames: data.recentWinnerNames,
          recentWasDraw: data.recentWasDraw,
        };
        renderBanner();

        if (data.leaderboard.length === 0) {
          statusEl.textContent = 'ยังไม่มีสัปดาห์ไหนล็อกแต้มพิเศษ รอ gameweek แรกจบก่อนนะครับ';
          return;
        }

        tableEl.innerHTML = data.leaderboard
          .map(
            (r, i) => `
          <div class="row ${i === 0 ? 'rank-1' : ''}">
            <div class="row-left">
              <span class="rank">${rankCell(i)}</span>
              <div class="team-text">
                <div class="team">${r.teamName}${
                  r.liveBonus > 0
                    ? '<span class="live-badge">LIVE</span>'
                    : r.recentDraw
                    ? `<span class="draw-badge">DRAW GW${data.latestLockedGameweek}</span>`
                    : r.recentWin
                    ? `<span class="win-badge">WIN GW${data.latestLockedGameweek}</span>`
                    : ''
                }</div>
                <div class="manager">${r.managerName}</div>
              </div>
            </div>
            <div class="row-right">
              <span class="score-chip">${r.winsCount}</span>
              <span class="score-chip accent">${r.displayTotal}</span>
            </div>
          </div>`
          )
          .join('');

        statusEl.style.display = 'none';
        tableEl.style.display = 'block';
        document.getElementById('bonus-updated').textContent =
          'อัปเดตล่าสุด: ' + new Date(data.updatedAt).toLocaleString('th-TH');
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    async function loadFeed() {
      const statusEl = document.getElementById('feed-status');
      const listEl = document.getElementById('feed-list');

      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.feed.length === 0) {
          statusEl.textContent = 'ยังไม่มีไฮไลท์ รอ gameweek แรกจบก่อนนะครับ';
          return;
        }

        listEl.innerHTML = data.feed
          .map(
            (f) => `
          <div class="feed-card glass ${f.type}">
            <div class="feed-gw">Gameweek ${f.gameweek}</div>
            <div class="feed-msg">${f.message}</div>
          </div>`
          )
          .join('');

        statusEl.style.display = 'none';
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    loadDeadline();
    loadStandings();
    loadBonus();
    loadFeed();
    setInterval(renderCountdown, 60 * 1000);
    setInterval(loadDeadline, 30 * 60 * 1000);
    setInterval(loadStandings, 2 * 60 * 1000);
