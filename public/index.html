<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FPL League Scoreboard</title>
<style>
  :root {
    --bg: #0a0e1a;
    --card: #161d30;
    --purple: #37003c;
    --purple-light: #4a0050;
    --lime: #00ff87;
    --cyan: #04f5ff;
    --pink: #e90052;
    --text: #f0f2f8;
    --muted: #8b92a8;
    --gold: #ffd54a;
    --silver: #c9d2e0;
    --bronze: #e0995a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  .header {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 14px),
      linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%);
    padding: 28px 16px 22px;
    border-bottom: 3px solid var(--lime);
    margin-bottom: 20px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 8px;
  }
  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--lime);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,135,0.5); }
    50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(0,255,135,0); }
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    max-width: 480px;
  }
  .sub { color: rgba(255,255,255,0.65); font-size: 13px; }

  .banner {
    background: var(--card);
    border-left: 4px solid var(--lime);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .live-tag {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,255,135,0.12);
    color: var(--lime);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .live-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); animation: pulse 1.4s ease-in-out infinite; }
  .banner b { color: var(--lime); }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 11px 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active {
    background: var(--lime);
    color: #04241a;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { padding: 12px; text-align: left; font-size: 14px; }
  th {
    background: var(--purple);
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 2px solid var(--lime);
  }
  tbody tr:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr.rank-1 { background: linear-gradient(90deg, rgba(255,213,74,0.10), transparent 60%); }

  .rank { width: 44px; text-align: center; font-size: 15px; }
  .rank-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: var(--muted);
    font-weight: 700;
    font-size: 13px;
  }
  .rank-medal { font-size: 20px; }

  .team { font-weight: 700; }
  .manager { color: var(--muted); font-size: 12px; }
  .points { text-align: right; font-weight: 700; }
  .gw { text-align: right; color: var(--cyan); font-weight: 700; }
  .bonus { text-align: right; color: var(--lime); font-weight: 800; font-size: 15px; }
  .status { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
  .updated { color: var(--muted); font-size: 11px; margin-top: 10px; text-align: right; letter-spacing: 0.03em; }
  .footnote {
    color: var(--muted);
    font-size: 12px;
    margin-top: 28px;
    line-height: 1.7;
    padding-top: 16px;
    border-top: 1px dashed rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="wrap" style="padding:0">
      <div class="eyebrow"><span class="dot"></span>Live scoreboard</div>
      <h1 id="league-name">FPL League Scoreboard</h1>
      <div class="sub">-</div>
    </div>
  </div>

  <div class="wrap">
    <div id="leader-banner" class="banner" style="display:none">
      <span class="live-tag"><span class="dot"></span>Live</span>
      <span id="leader-text"></span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="standings">อันดับตารางรวม FPL</button>
      <button class="tab-btn" data-tab="bonus">เงินสะสม</button>
    </div>

    <div id="panel-standings" class="tab-panel active">
      <div id="standings-status" class="status">กำลังโหลด...</div>
      <table id="standings-table" style="display:none">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>ทีม</th>
            <th class="gw">GW</th>
            <th class="points">รวม</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
      <div id="standings-updated" class="updated"></div>
    </div>

    <div id="panel-bonus" class="tab-panel">
      <div id="bonus-status" class="status">กำลังโหลด...</div>
      <table id="bonus-table" style="display:none">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>ทีม</th>
            <th>ชนะ</th>
            <th class="bonus">เงินสะสม</th>
          </tr>
        </thead>
        <tbody id="bonus-body"></tbody>
      </table>
      <div id="bonus-updated" class="updated"></div>
    </div>

    <div class="footnote">
-
    </div>
  </div>

  <script>
    const LEAGUE_ID = '477187';
    const MEDALS = ['🥇', '🥈', '🥉'];

    function rankCell(i) {
      if (i < 3) return `<span class="rank-medal">${MEDALS[i]}</span>`;
      return `<span class="rank-num">${i + 1}</span>`;
    }

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    async function loadStandings() {
      const statusEl = document.getElementById('standings-status');
      const tableEl = document.getElementById('standings-table');
      const tbody = document.getElementById('standings-body');
      const bannerEl = document.getElementById('leader-banner');
      const leaderTextEl = document.getElementById('leader-text');

      try {
        const res = await fetch(`/api/standings?league=${LEAGUE_ID}`);
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.leagueName) {
          document.getElementById('league-name').textContent = data.leagueName;
        }

        tbody.innerHTML = data.results
          .map(
            (r, i) => `
          <tr class="${i === 0 ? 'rank-1' : ''}">
            <td class="rank">${rankCell(i)}</td>
            <td>
              <div class="team">${r.teamName}</div>
              <div class="manager">${r.managerName}</div>
            </td>
            <td class="gw">${r.gwPoints}</td>
            <td class="points">${r.totalPoints}</td>
          </tr>`
          )
          .join('');

        if (data.currentLeaders && data.currentLeaders.length > 0) {
          const names = data.currentLeaders.map((l) => l.teamName).join(', ');
          leaderTextEl.innerHTML = `กำลังนำอยู่: <b>${names}</b> — ${data.currentLeaders[0].gwPoints} แต้ม (ยังไม่ล็อกแต้มพิเศษ)`;
          bannerEl.style.display = 'flex';
        }

        statusEl.style.display = 'none';
        tableEl.style.display = 'table';
        document.getElementById('standings-updated').textContent =
          'อัปเดตล่าสุด: ' + new Date(data.updatedAt).toLocaleString('th-TH');
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    async function loadBonus() {
      const statusEl = document.getElementById('bonus-status');
      const tableEl = document.getElementById('bonus-table');
      const tbody = document.getElementById('bonus-body');

      try {
        const res = await fetch('/api/bonus');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.leaderboard.length === 0) {
          statusEl.textContent = 'ยังไม่มีสัปดาห์ไหนล็อกแต้มพิเศษ รอ gameweek แรกจบก่อนนะครับ';
          return;
        }

        tbody.innerHTML = data.leaderboard
          .map(
            (r, i) => `
          <tr class="${i === 0 ? 'rank-1' : ''}">
            <td class="rank">${rankCell(i)}</td>
            <td>
              <div class="team">${r.teamName}</div>
              <div class="manager">${r.managerName}</div>
            </td>
            <td>${r.winsCount}</td>
            <td class="bonus">${r.totalBonus}</td>
          </tr>`
          )
          .join('');

        statusEl.style.display = 'none';
        tableEl.style.display = 'table';
        document.getElementById('bonus-updated').textContent =
          'อัปเดตล่าสุด: ' + new Date(data.updatedAt).toLocaleString('th-TH');
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    loadStandings();
    loadBonus();
    setInterval(loadStandings, 5 * 60 * 1000);
    setInterval(loadBonus, 5 * 60 * 1000);
  </script>
</body>
</html>
