<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FPL League Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-2: #1c222c;
    --border: #262c36;
    --accent: #ff5a1f;
    --live: #ff3b30;
    --text: #e6edf3;
    --muted: #8b949e;
    --gold: #ffc93c;
    --silver: #c9d1d9;
    --bronze: #d38b5d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 60px;
    font-feature-settings: "tnum";
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .numeric { font-family: 'Rajdhani', sans-serif; font-variant-numeric: tabular-nums; }

  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px;
    margin-bottom: 16px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--live);
    margin-bottom: 6px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 2px;
    color: #fff;
  }
  .sub { color: var(--muted); font-size: 12.5px; }

  .banner {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--live);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .live-tag {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,59,48,0.14);
    color: var(--live);
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    padding: 2px 8px; border-radius: 3px;
  }
  .live-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--live); animation: pulse 1.3s ease-in-out infinite; }
  .banner b { color: #fff; }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 6px;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn.active {
    color: #fff;
    border-bottom-color: var(--accent);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 10px; text-align: left; font-size: 13.5px; }
  th {
    background: var(--card-2);
    color: var(--muted);
    font-weight: 600;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:not(:last-child) { border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr.rank-1 td:first-child { box-shadow: inset 3px 0 0 var(--gold); }

  .rank { width: 30px; text-align: center; color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .rank-medal { font-size: 18px; }

  .team-cell { display: flex; align-items: center; }
  .team-text { display: flex; flex-direction: column; line-height: 1.25; }
  .team { font-weight: 600; font-size: 13.5px; color: #fff; }
  .manager { color: var(--muted); font-size: 11px; }

  .score-chip {
    display: inline-block;
    min-width: 30px;
    text-align: center;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--card-2);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
  }
  .points-cell { text-align: right; }
  .gw-cell { text-align: right; }
  .gw-cell .score-chip { color: var(--accent); }
  .bonus-cell { text-align: right; }
  .bonus-cell .score-chip { background: rgba(255,90,31,0.15); color: var(--accent); font-size: 15px; }

  .status { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .updated { color: var(--muted); font-size: 10.5px; margin-top: 8px; text-align: right; }
  .footnote {
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
    line-height: 1.6;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .feed-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 13px;
    margin-bottom: 8px;
    border-left: 3px solid var(--muted);
  }
  .feed-card.steal { border-left-color: var(--live); }
  .feed-card.tie { border-left-color: #4ea1ff; }
  .feed-card.normal { border-left-color: var(--accent); }
  .feed-gw {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .feed-msg { font-size: 13.5px; line-height: 1.55; }
</style>
</head>
<body>
  <div class="header">
    <div class="wrap" style="padding:0">
      <div class="eyebrow"><span class="dot"></span>Live scoreboard</div>
      <h1 id="league-name">FPL League Scoreboard</h1>
      <div class="sub" id="sub-text">กำลังโหลด...</div>
    </div>
  </div>

  <div class="wrap">
    <div id="leader-banner" class="banner" style="display:none">
      <span class="live-tag"><span class="dot"></span>Live</span>
      <span id="leader-text"></span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="standings">อันดับ FPL</button>
      <button class="tab-btn" data-tab="bonus">รายได้สะสม</button>
      <button class="tab-btn" data-tab="feed">ไฮไลท์</button>
    </div>

    <div id="panel-standings" class="tab-panel active">
      <div id="standings-status" class="status">กำลังโหลด...</div>
      <table id="standings-table" style="display:none">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>ทีม</th>
            <th class="gw-cell">GW</th>
            <th class="points-cell">รวม</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
      <div id="standings-updated" class="updated"></div>
    </div>

    <div id="panel-bonus" class="tab-panel">
      <div id="bonus-status" class="status">กำลังโหลด...</div>
      <table id="bonus-table" style="display:none">
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>ทีม</th>
            <th>ชนะ</th>
            <th class="bonus-cell">รายได้สะสม</th>
          </tr>
        </thead>
        <tbody id="bonus-body"></tbody>
      </table>
      <div id="bonus-updated" class="updated"></div>
    </div>

    <div id="panel-feed" class="tab-panel">
      <div id="feed-status" class="status">กำลังโหลด...</div>
      <div id="feed-list"></div>
    </div>

    <div class="footnote">
    </div>
  </div>

  <script>
    const LEAGUE_ID = '477187';
    const MEDALS = ['🥇', '🥈', '🥉'];

    function rankCell(i) {
      if (i < 3) return `<span class="rank-medal">${MEDALS[i]}</span>`;
      return `${i + 1}`;
    }

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    async function loadStandings() {
      const statusEl = document.getElementById('standings-status');
      const tableEl = document.getElementById('standings-table');
      const tbody = document.getElementById('standings-body');
      const bannerEl = document.getElementById('leader-banner');
      const leaderTextEl = document.getElementById('leader-text');

      try {
        const res = await fetch(`/api/standings?league=${LEAGUE_ID}`);
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.leagueName) {
          document.getElementById('league-name').textContent = data.leagueName;
        }

        const sortedResults = [...data.results].sort((a, b) => b.gwPoints - a.gwPoints);

        tbody.innerHTML = sortedResults
          .map(
            (r, i) => `
          <tr class="${i === 0 ? 'rank-1' : ''}">
            <td class="rank">${rankCell(i)}</td>
            <td>
              <div class="team-cell">
                <div class="team-text">
                  <span class="team">${r.teamName}</span>
                  <span class="manager">${r.managerName}</span>
                </div>
              </div>
            </td>
            <td class="gw-cell"><span class="score-chip">${r.gwPoints}</span></td>
            <td class="points-cell"><span class="score-chip">${r.totalPoints}</span></td>
          </tr>`
          )
          .join('');

        if (data.currentLeaders && data.currentLeaders.length > 0) {
          const names = data.currentLeaders.map((l) => l.teamName).join(', ');
          leaderTextEl.innerHTML = `กำลังนำอยู่: <b>${names}</b> — ${data.currentLeaders[0].gwPoints} แต้ม (ยังไม่ล็อกแต้มพิเศษ)`;
          bannerEl.style.display = 'flex';
        }

        statusEl.style.display = 'none';
        tableEl.style.display = 'table';
        document.getElementById('standings-updated').textContent =
          'อัปเดตล่าสุด: ' + new Date(data.updatedAt).toLocaleString('th-TH');
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    async function loadBonus() {
      const statusEl = document.getElementById('bonus-status');
      const tableEl = document.getElementById('bonus-table');
      const tbody = document.getElementById('bonus-body');

      try {
        const res = await fetch('/api/bonus');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.leaderboard.length === 0) {
          statusEl.textContent = 'ยังไม่มีสัปดาห์ไหนล็อกแต้มพิเศษ รอ gameweek แรกจบก่อนนะครับ';
          return;
        }

        tbody.innerHTML = data.leaderboard
          .map(
            (r, i) => `
          <tr class="${i === 0 ? 'rank-1' : ''}">
            <td class="rank">${rankCell(i)}</td>
            <td>
              <div class="team-cell">
                <div class="team-text">
                  <span class="team">${r.teamName}</span>
                  <span class="manager">${r.managerName}</span>
                </div>
              </div>
            </td>
            <td>${r.winsCount}</td>
            <td class="bonus-cell"><span class="score-chip">${r.totalBonus}</span></td>
          </tr>`
          )
          .join('');

        statusEl.style.display = 'none';
        tableEl.style.display = 'table';
        document.getElementById('bonus-updated').textContent =
          'อัปเดตล่าสุด: ' + new Date(data.updatedAt).toLocaleString('th-TH');
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    async function loadFeed() {
      const statusEl = document.getElementById('feed-status');
      const listEl = document.getElementById('feed-list');

      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (data.feed.length === 0) {
          statusEl.textContent = 'ยังไม่มีไฮไลท์ รอ gameweek แรกจบก่อนนะครับ';
          return;
        }

        listEl.innerHTML = data.feed
          .map(
            (f) => `
          <div class="feed-card ${f.type}">
            <div class="feed-gw">Gameweek ${f.gameweek}</div>
            <div class="feed-msg">${f.message}</div>
          </div>`
          )
          .join('');

        statusEl.style.display = 'none';
      } catch (err) {
        statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      }
    }

    let deadlineTarget = null;
    let deadlineGw = null;

    function renderCountdown() {
      const subEl = document.getElementById('sub-text');
      if (!deadlineTarget) return;

      const diff = deadlineTarget - Date.now();
      if (diff <= 0) {
        subEl.textContent = `ปิดรับเปลี่ยนตัว GW${deadlineGw} แล้ว`;
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);

      let parts = [];
      if (days > 0) parts.push(`${days} วัน`);
      parts.push(`${hours} ชม.`);
      parts.push(`${mins} นาที`);

      subEl.textContent = `ปิดรับเปลี่ยนตัว GW${deadlineGw} ในอีก ${parts.join(' ')}`;
    }

    async function loadDeadline() {
      const subEl = document.getElementById('sub-text');
      try {
        const res = await fetch('/api/deadline');
        if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ');
        const data = await res.json();

        if (!data.deadline) {
          subEl.textContent = data.message || 'ไม่มี deadline ถัดไป';
          return;
        }

        deadlineTarget = new Date(data.deadline).getTime();
        deadlineGw = data.gameweek;
        renderCountdown();
      } catch (err) {
        subEl.textContent = '-';
      }
    }

    loadDeadline();
    loadStandings();
    loadBonus();
    loadFeed();
    setInterval(renderCountdown, 60 * 1000);
    setInterval(loadDeadline, 30 * 60 * 1000);
    setInterval(loadStandings, 5 * 60 * 1000);
    setInterval(loadBonus, 5 * 60 * 1000);
    setInterval(loadFeed, 5 * 60 * 1000);
  </script>
</body>
</html>
